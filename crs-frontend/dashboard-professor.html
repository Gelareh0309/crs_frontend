<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>داشبورد استاد — سامانه انتخاب واحد</title>
    <link rel="stylesheet" href="css/dashboard-admin.css" />
  </head>
  <body>
    <div id="app" class="app-root">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar" aria-label="منوی اصلی">
        <div class="brand">
          <div class="logo">
            <img
              src="images/logo.jpg"
              alt="University Logo"
              style="width: 100%; height: 100%; border-radius: 12px"
            />
          </div>
          <div class="brand-txt">
            <div class="title">سامانه انتخاب واحد</div>
            <div class="subtitle muted">پنل استاد</div>
          </div>
        </div>

        <nav class="menu" role="navigation" aria-label="ناوبری اصلی">
          <button
            class="menu-item active"
            data-panel="section"
            aria-pressed="true"
          >
            📅 تمام سکشن‌ها
          </button>
          <button class="menu-item" data-panel="mySections">
            📚 سکشن‌های من
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="muted small">نسخه 1.0</div>
          <div class="muted small">© دانشگاه</div>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="main-area">
        <!-- header -->
        <header class="topbar" role="banner">
          <div class="left">
            <button id="mobileToggle" class="icon-btn" aria-label="نمایش منو">
              ☰
            </button>
            <h1 id="pageTitle" class="page-title">تمام سکشن‌ها</h1>
          </div>

          <div class="right">
            <div class="user-pill" id="userPill" aria-hidden="false">
              <div class="avatar" id="avatar"></div>
              <div class="user-info">
                <div id="userName">استاد</div>
                <div class="muted small" id="userRole">PROFESSOR</div>
              </div>
            </div>
            <button id="btnLogout" class="btn ghost">خروج</button>
          </div>
        </header>

        <!-- content -->
        <main class="content" id="content" role="main">
          <!-- PANEL: SECTION (read-only) -->
          <section
            id="panel-section"
            class="panel panel--active"
            aria-labelledby="pageTitle"
          >
            <div class="panel-header">
              <h2>تمام سکشن‌ها</h2>
              <div class="panel-actions">
                <input
                  id="secSearchProf"
                  type="text"
                  class="search-input"
                  placeholder="جستجو بر اساس درس، کلاس یا روز..."
                  style="max-width: 260px"
                />
              </div>
            </div>
            <div class="table-wrap" aria-live="polite">
              <table
                class="table"
                id="sectionsTable"
                role="table"
                aria-label="لیست سکشن‌ها"
              >
                <thead>
                  <tr>
                    <th scope="col">کد درس</th>
                    <th scope="col">نام درس</th>
                    <th scope="col">استاد</th>
                    <th scope="col">واحد</th>
                    <th scope="col">زمان‌بندی</th>
                    <th scope="col">ظرفیت</th>
                  </tr>
                </thead>
                <tbody id="sectionsTbody">
                  <tr>
                    <td colspan="6" class="muted">در حال بارگذاری...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <!-- PANEL: MY SECTIONS (sections where professor is instructor) -->
          <section id="panel-mySections" class="panel" style="display: none">
            <div class="panel-header">
              <h2>سکشن‌های من</h2>
              <div class="panel-actions">
                <button id="refreshMySections" class="btn ghost">رفرش</button>
              </div>
            </div>
            <div class="table-wrap" aria-live="polite">
              <table
                class="table"
                id="mySectionsTable"
                role="table"
                aria-label="سکشن‌های من"
              >
                <thead>
                  <tr>
                    <th scope="col">کد درس</th>
                    <th scope="col">نام درس</th>
                    <th scope="col">واحد</th>
                    <th scope="col">کلاس</th>
                    <th scope="col">زمان‌بندی</th>
                    <th scope="col">ظرفیت</th>
                  </tr>
                </thead>
                <tbody id="mySectionsTbody">
                  <tr>
                    <td colspan="6" class="muted">در حال بارگذاری...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Overlay + Modal: Section students -->
    <div id="overlay" class="overlay hidden" tabindex="-1" aria-hidden="true"></div>
    <div
      id="sectionStudentsModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sectionStudentsModalTitle"
    >
      <div class="modal-card" style="max-width: 560px; width: 92vw;">
        <h3 id="sectionStudentsModalTitle">دانشجویان کلاس</h3>
        <div class="table-wrap" style="max-height: 60vh;">
          <table class="table" id="sectionStudentsTable" role="table" aria-label="لیست دانشجویان">
            <thead>
              <tr>
                <th scope="col">کد دانشجو</th>
                <th scope="col">نام</th>
                <th scope="col">عملیات</th>
              </tr>
            </thead>
            <tbody id="sectionStudentsTbody">
              <tr><td colspan="3" class="muted">در حال بارگذاری...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="modal-actions" style="margin-top: 12px;">
          <button type="button" id="closeSectionStudentsModal" class="btn ghost">بستن</button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard-professor.js"></script>
  </body>
</html>
