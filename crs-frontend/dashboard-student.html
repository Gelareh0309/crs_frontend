<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>داشبورد دانشجو — سامانه انتخاب واحد</title>
    <link rel="stylesheet" href="css/dashboard-admin.css" />
  </head>
  <body>
    <div id="app" class="app-root">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar" aria-label="منوی اصلی">
        <div class="brand">
          <div class="logo">
            <img
              src="images/logo.jpg"
              alt="University Logo"
              style="width: 100%; height: 100%; border-radius: 12px"
            />
          </div>
          <div class="brand-txt">
            <div class="title">سامانه انتخاب واحد</div>
            <div class="subtitle muted">پنل دانشجو</div>
          </div>
        </div>

        <nav class="menu" role="navigation" aria-label="ناوبری اصلی">
          <button
            class="menu-item active"
            data-panel="section"
            aria-pressed="true"
          >
            📚 همه سکشن‌ها
          </button>

          <button class="menu-item" data-panel="enrollments">
            📝 سکشن‌های ثبت‌نام‌شده
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="muted small">نسخه 1.0</div>
          <div class="muted small">© دانشگاه</div>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="main-area">
        <!-- header -->
        <header class="topbar" role="banner">
          <div class="left">
            <button id="mobileToggle" class="icon-btn" aria-label="نمایش منو">
              ☰
            </button>
            <h1 id="pageTitle" class="page-title">همه سکشن‌ها</h1>
          </div>

          <div class="right">
            <div class="user-pill" id="userPill" aria-hidden="false">
              <div class="avatar" id="avatar"></div>
              <div class="user-info">
                <div id="userName">دانشجو</div>
                <div class="muted small" id="userRole">STUDENT</div>
              </div>
            </div>
            <button id="btnLogout" class="btn ghost">خروج</button>
          </div>
        </header>

        <!-- content -->
        <main class="content" id="content" role="main">
          <!-- PANEL: SECTIONS (all, read-only) -->
          <section
            id="panel-section"
            class="panel panel--active"
            aria-labelledby="pageTitle"
          >
            <div class="panel-header">
              <h2>لیست همه سکشن‌ها</h2>
              <div class="panel-actions">
                <input
                  id="searchInput"
                  type="text"
                  class="search-input"
                  placeholder="جستجو بر اساس نام درس یا استاد"
                  style="max-width: 260px"
                  onkeyup="searchSection()"
                />
              </div>
            </div>

            <div class="table-wrap" aria-live="polite">
              <table
                class="table"
                id="sectionsTable"
                role="table"
                aria-label="لیست سکشن‌ها"
              >
                <thead>
                  <tr>
                    <th scope="col">کد درس</th>
                    <th scope="col">نام درس</th>
                    <th scope="col">استاد</th>
                    <th scope="col">واحد</th>
                    <th scope="col">زمان‌بندی</th>
                    <th scope="col">ظرفیت</th>
                    <th scope="col">عملیات</th>
                  </tr>
                </thead>
                <tbody id="sectionsTbody">
                  <tr>
                    <td colspan="6" class="muted">در حال بارگذاری...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <!-- PANEL: ENROLLMENTS -->
          <section id="panel-enrollments" class="panel" style="display: none">
            <div class="panel-header">
              <h2>سکشن‌های ثبت‌نام‌شده</h2>
              <div class="panel-actions">
                <button id="refreshEnrollments" class="btn ghost">رفرش</button>
              </div>
            </div>

            <div class="table-wrap" aria-live="polite">
              <table
                class="table"
                id="enrollmentsTable"
                role="table"
                aria-label="سکشن‌های ثبت‌نام‌شده"
              >
                <thead>
                  <tr>
                    <th scope="col">کد درس</th>
                    <th scope="col">نام درس</th>
                    <th scope="col">واحد</th>
                    <th scope="col">استاد</th>
                    <th scope="col">کلاس</th>
                    <th scope="col">زمان‌بندی</th>
                    <th scope="col">وضعیت</th>
                    <th scope="col">عملیات</th>
                  </tr>
                </thead>
                <tbody id="enrollmentsTbody">
                  <tr>
                    <td colspan="6" class="muted">در حال بارگذاری...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard-student.js"></script>
  </body>
</html>
